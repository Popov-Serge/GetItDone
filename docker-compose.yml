services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev

    container_name: getitdone-api

    ports:
      - "8080:8080"

    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:18

    container_name: getitdone-postgres

    environment:
      POSTGRES_DB: getitdone
      POSTGRES_USER: getitdone
      POSTGRES_PASSWORD: getitdone

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getitdone -d getitdone"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: getitdone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


volumes:
  postgres_data:
  go_modules:
  go_build_cache:
  redis_data: